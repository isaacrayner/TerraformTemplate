trigger:
  branches:
    include:
      - main
  paths:
    include:
      - modules/*
      - deployments/_template/*
      - scripts/validate.sh
      - .azure-pipelines/terraform-deploy.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - modules/*
      - deployments/_template/*
      - scripts/validate.sh
      - .azure-pipelines/terraform-deploy.yml

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: 1.9.8

stages:
  - stage: Validate
    displayName: Validate module catalog
    jobs:
      - job: TerraformValidate
        displayName: Format and validate Terraform
        steps:
          - checkout: self

          # TerraformInstaller is supplied by the Microsoft DevLabs Terraform
          # extension. Install that extension once in the Azure DevOps org.
          - task: TerraformInstaller@1
            displayName: Install Terraform $(terraformVersion)
            inputs:
              terraformVersion: $(terraformVersion)

          - bash: ./scripts/validate.sh
            displayName: Validate implemented modules and deployment template
